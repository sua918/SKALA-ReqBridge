spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_MAX_SIZE:5}

# The Supabase schema is applied manually in SQL Editor by the DB owner.
spring.flyway.enabled=false

# Hibernate uses prepared statements, so use Supabase's session pooler on port 5432
# (or a direct connection), not the transaction pooler on port 6543.
