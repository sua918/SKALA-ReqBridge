spring.application.name=reqbridge

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.locations=classpath:db/migration
