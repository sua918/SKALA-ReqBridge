spring.application.name=reqbridge

# API 0.4: reject undefined JSON fields and numeric enum ordinals.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

spring.servlet.multipart.max-file-size=10MB
# Allow multipart boundary/title overhead for a file of exactly 10 MiB.
spring.servlet.multipart.max-request-size=12MB

# Optional for TEXT-only development; required when PDF upload is used.
reqbridge.storage.url=${SUPABASE_URL:}
reqbridge.storage.bucket=${SUPABASE_STORAGE_BUCKET:}
reqbridge.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# AI Provider (mock or llm)
reqbridge.ai.provider=${AI_PROVIDER:mock}

# OpenAI configuration
openai.api-key=${OPENAI_API_KEY:}
openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.locations=classpath:db/migration
